<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ROI Simulator｜投資対効果シミュレーター</title>
<meta name="description" content="削減工数・人件費換算効果・投資回収期間をその場で試算する概算ツール（端末内で計算・オフライン対応）">
<meta name="theme-color" content="#cdebf7">
<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ROI Simulator">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="stylesheet" href="./css/app.css">
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<header class="app-header">
  <h1>
    <span class="title-en">ROI Simulator</span>
    <span class="title-ja">投資対効果シミュレーター</span>
  </h1>
</header>

<main>
  <section class="panel">
    <label class="project-label" for="project">案件名 <span class="optional">任意</span></label>
    <input id="project" class="project-input" type="text" maxlength="60" placeholder="例：在庫管理システム"
           autocomplete="off" enterkeyhint="done">
  </section>

  <section class="panel" aria-labelledby="h-inputs">
    <h2 id="h-inputs">試算条件</h2>
    <div id="fields" class="fields"></div>
  </section>

  <section class="panel" aria-labelledby="h-results">
    <h2 id="h-results">試算結果</h2>
    <div id="cards" class="cards" aria-live="polite"></div>
  </section>

  <section class="panel" aria-labelledby="h-chart">
    <h2 id="h-chart">効果と費用の比較 <span class="h-note">単位：万円</span></h2>
    <div id="chart" class="chart"></div>
  </section>

  <div class="actions">
    <button id="reset" type="button" class="btn btn-secondary">リセット</button>
    <button id="copy" type="button" class="btn btn-primary">試算結果をコピー</button>
  </div>

  <section class="notes" aria-label="注意事項">
    <p>本シミュレーターは、削減工数を人件費に換算した投資対効果の概算ツールです。人件費換算効果は、実際の現金支出削減額を保証するものではありません。品質向上、安全性向上、リスク低減等による効果は含まれていません。</p>
    <p>「1件あたりの純削減時間」には、新たに発生する作業時間を差し引いた、実質的な削減時間を入力してください。</p>
    <p class="meta">入力内容はこの端末の中だけに保存され、外部へは送信されません。<span id="version"></span></p>
  </section>
</main>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="./js/calc.js"></script>
<script src="./js/format.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
